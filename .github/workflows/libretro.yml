name: libretro core

on:
  workflow_dispatch:
  push:
    branches: [demarc]
    paths-ignore:
      - '**.md'
      - 'wiki/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64
    # Oldest supported runner, so the core links against an older glibc and
    # stays loadable on the widest range of RetroArch installs.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev curl file

      - name: Build core
        run: make -C libretro platform=unix -j"$(nproc)"

      - name: Inspect core
        run: |
          file libretro/amiberry_libretro.so
          ls -l libretro/amiberry_libretro.so
          cat libretro/amiberry_libretro.info

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: amiberry_libretro-linux-x86_64
          path: |
            libretro/amiberry_libretro.so
            libretro/amiberry_libretro.info
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install pkgconf || true

      - name: Build core
        run: make -C libretro platform=osx ARCH=arm64 -j"$(sysctl -n hw.ncpu)"

      - name: Inspect core
        run: |
          file libretro/amiberry_libretro.dylib
          ls -l libretro/amiberry_libretro.dylib
          cat libretro/amiberry_libretro.info

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: amiberry_libretro-macos-arm64
          path: |
            libretro/amiberry_libretro.dylib
            libretro/amiberry_libretro.info
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # CLANG64 matches the toolchain the libretro Makefile prefers on Windows
      # (it probes /clang64/bin/clang.exe), and keeps the core's ABI aligned
      # with the Clang/LLD-based main Amiberry Windows build.
      - name: Set up MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          release: false
          install: >-
            make
            curl
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-libiconv

      - name: Build core
        run: make -C libretro platform=win -j"$(nproc)"

      - name: Inspect core
        run: |
          file libretro/amiberry_libretro.dll || true
          ls -l libretro/amiberry_libretro.dll
          cat libretro/amiberry_libretro.info

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: amiberry_libretro-windows-x64
          path: |
            libretro/amiberry_libretro.dll
            libretro/amiberry_libretro.info
          if-no-files-found: error

  # Publishes the three cores to a rolling "latest" release, so the demarc app
  # can fetch them from a URL that never changes. Both of these resolve to the
  # newest successful build:
  #   https://github.com/sasq64/amiberry/releases/download/latest/<asset>
  #   https://github.com/sasq64/amiberry/releases/latest/download/<asset>
  # manifest.json lists each zip with its size and sha256.
  publish:
    name: Publish rolling release
    needs: [linux-x86_64, macos-arm64, windows-x64]
    if: github.ref == 'refs/heads/demarc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download built cores
        uses: actions/download-artifact@v8
        with:
          path: dist

      # One zip per platform, each holding the core under the plain name
      # RetroArch expects (amiberry_libretro.so/.dylib/.dll) plus the .info,
      # so the app can unzip straight into its cores directory.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          zip_core() {
            artifact="$1"
            core="$2"
            (cd "dist/$artifact" && zip -9 -X "$GITHUB_WORKSPACE/release/$artifact.zip" "$core" amiberry_libretro.info)
          }
          zip_core amiberry_libretro-linux-x86_64 amiberry_libretro.so
          zip_core amiberry_libretro-macos-arm64 amiberry_libretro.dylib
          zip_core amiberry_libretro-windows-x64 amiberry_libretro.dll
          ls -l release

      - name: Write manifest.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, pathlib

          version = "0.0.0"
          m = re.search(r"VERSION\s+(\d+\.\d+\.\d+)", pathlib.Path("CMakeLists.txt").read_text())
          if m:
              version = m.group(1)

          assets = {
              "linux-x86_64": ("amiberry_libretro-linux-x86_64.zip", "amiberry_libretro.so"),
              "macos-arm64":  ("amiberry_libretro-macos-arm64.zip", "amiberry_libretro.dylib"),
              "windows-x64":  ("amiberry_libretro-windows-x64.zip", "amiberry_libretro.dll"),
          }
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}"

          manifest = {
              "version": version,
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "cores": {},
          }
          for platform, (name, core) in assets.items():
              data = pathlib.Path("release", name).read_bytes()
              manifest["cores"][platform] = {
                  "file": name,
                  "core": core,
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          pathlib.Path("release/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          cat release/manifest.json

      - name: Move the rolling tag
        run: |
          set -euo pipefail
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - name: Publish release
        run: |
          set -euo pipefail
          NOTES="Rolling libretro core build from \`$GITHUB_SHA\` — see manifest.json for versions and checksums."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "libretro core (latest)" --notes "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" --title "libretro core (latest)" --notes "$NOTES" --latest
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
